name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]  # 3.11 matches recent ArcGIS Pro releases
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest --cov=gisqa --cov-report=term-missing
      - name: Sample run
        run: gisqa examples/sample_parcels.geojson --rules examples/parcels_rules.json --oid-field PARCEL_ID --fail-on never
